name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  owner-acceptance:
    uses: ./.github/workflows/owner-acceptance.yml
  test:
    name: test-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install -e . pytest build twine pre-commit

      - name: Run tests
        run: python -m pytest -q

      - name: Rehearse local shell, SQL, MCP, audit, and pre-commit enforcement
        run: python scripts/verify_appsec_demo.py --output /tmp/acb-appsec-results.json

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/agent_circuit_breaker-*.whl dist/agent_circuit_breaker-*.tar.gz

      - name: Smoke exact wheel outside checkout
        run: |
          python -m venv /tmp/acb-ci-wheel
          /tmp/acb-ci-wheel/bin/pip install --no-index dist/*.whl
          cd /tmp
          /tmp/acb-ci-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/package_smoke.py"
          /tmp/acb-ci-wheel/bin/agent-circuit-breaker --version
          /tmp/acb-ci-wheel/bin/agent-circuit-breaker demo --doctor

      - name: Check real MCP SDK interoperability
        run: |
          /tmp/acb-ci-wheel/bin/pip install 'mcp==2.3.0'
          cd /tmp
          /tmp/acb-ci-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/mcp_sdk_smoke.py"

      - name: Check whitespace
        run: git diff --check

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install -e . pytest build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/agent_circuit_breaker-*.whl dist/agent_circuit_breaker-*.tar.gz

      - name: Smoke installed wheel
        run: |
          python -m pip uninstall -y agent-circuit-breaker
          python -m pip install --no-index --find-links dist agent-circuit-breaker
          python -c "import agent_circuit_breaker, importlib.metadata as m; assert agent_circuit_breaker.__version__ == m.version('agent-circuit-breaker')"
          agent-circuit-breaker check "mkdir /tmp/acb-ci-smoke"

      - name: Check whitespace
        run: git diff --check
